<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Authority Dashboard{% endblock %} — Livestock System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .sidebar { min-height: 100vh; background: #1a3c2e; }
    .sidebar .nav-link { color: #adb5bd; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.1); border-radius: .375rem; }
    .sidebar-brand { color: #fff; font-weight: 700; }
    .status-badge { font-size: .75rem; }
    .table th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; }
  </style>
</head>
<body class="bg-light">
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <nav class="col-md-2 d-md-block sidebar py-3 px-3">
      <a class="sidebar-brand d-block mb-4 text-decoration-none" href="{% url 'dashboard:index' %}">
        <i class="bi bi-shield-check me-2"></i>Authority Portal
      </a>
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
             href="{% url 'dashboard:index' %}">
            <i class="bi bi-speedometer2 me-2"></i>Overview
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'report' in request.resolver_match.url_name %}active{% endif %}"
             href="{% url 'dashboard:report_queue' %}">
            <i class="bi bi-clipboard2-pulse me-2"></i>Disease Reports
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'announcement' in request.resolver_match.url_name %}active{% endif %}"
             href="{% url 'dashboard:announcement_list' %}">
            <i class="bi bi-megaphone me-2"></i>Announcements
          </a>
        </li>
      </ul>
      <hr class="border-secondary mt-4">
      <div class="text-secondary small px-2">{{ request.user.username }}</div>
      <a class="nav-link text-secondary" href="{% url 'dashboard:logout' %}">
        <i class="bi bi-box-arrow-left me-2"></i>Logout
      </a>
    </nav>

    <!-- Main content -->
    <main class="col-md-10 ms-sm-auto px-4 py-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
