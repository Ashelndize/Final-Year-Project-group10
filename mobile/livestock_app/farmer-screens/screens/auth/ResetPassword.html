<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set new password</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B45}a:hover{color:#154D31}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F1; font-family: Inter, system-ui, sans-serif; color: #1B2620; display: flex; flex-direction: column; padding: 16px 24px 28px">

<a href="ForgotPassword.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #1B2620">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Set a new password</h1>
<p style="margin: 0; font-size: 15px; color: #3E4A43; line-height: 1.5">If an account matches <strong style="font-weight: 600">0788 ••• 456</strong>, we sent it a 6-digit code. The code expires in 15 minutes.</p>
</div>

<form style="display: flex; flex-direction: column; gap: 16px; margin-top: 22px">

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">6-digit code</legend>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<input aria-label="Digit 1" inputmode="numeric" maxlength="1" value="4" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #1E6B45; background: #FFFFFF; text-align: center; font-family: inherit; font-size: 20px; font-weight: 600; color: #1B2620; min-width: 0">
<input aria-label="Digit 2" inputmode="numeric" maxlength="1" value="8" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #1E6B45; background: #FFFFFF; text-align: center; font-family: inherit; font-size: 20px; font-weight: 600; color: #1B2620; min-width: 0">
<input aria-label="Digit 3" inputmode="numeric" maxlength="1" value="2" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #1E6B45; background: #FFFFFF; text-align: center; font-family: inherit; font-size: 20px; font-weight: 600; color: #1B2620; min-width: 0">
<input aria-label="Digit 4" inputmode="numeric" maxlength="1" value="" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 2px solid #1E6B45; background: #FFFFFF; text-align: center; font-family: inherit; font-size: 20px; font-weight: 600; color: #1B2620; min-width: 0">
<input aria-label="Digit 5" inputmode="numeric" maxlength="1" value="" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; text-align: center; font-family: inherit; font-size: 20px; font-weight: 600; color: #1B2620; min-width: 0">
<input aria-label="Digit 6" inputmode="numeric" maxlength="1" value="" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; text-align: center; font-family: inherit; font-size: 20px; font-weight: 600; color: #1B2620; min-width: 0">
</div>
<span style="font-size: 13px; color: #5B675F">Didn't get it? Resend code in 0:45</span>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="new-password" style="font-size: 14px; font-weight: 600">New password</label>
<input id="new-password" type="password" autocomplete="new-password" value="••••••••••" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; color: #1B2620">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="confirm-password" style="font-size: 14px; font-weight: 600">Confirm new password</label>
<input id="confirm-password" type="password" autocomplete="new-password" value="••••••••••" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; color: #1B2620">
</div>

<ul aria-label="Password rules" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
<li style="display: flex; align-items: center; gap: 8px; color: #1E6B45"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>At least 8 characters</li>
<li style="display: flex; align-items: center; gap: 8px; color: #1E6B45"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Not a common password</li>
<li style="display: flex; align-items: center; gap: 8px; color: #1E6B45"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Both passwords match</li>
</ul>

<a href="Login.html" style="height: 52px; border-radius: 26px; background: #1E6B45; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; margin-top: 4px">Set new password</a>

</form>

</div>
</body>
</html>
