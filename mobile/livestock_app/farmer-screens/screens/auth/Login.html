<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B45}a:hover{color:#154D31}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F1; font-family: Inter, system-ui, sans-serif; color: #1B2620; display: flex; flex-direction: column; padding: 20px 24px 28px">

<div style="display: flex; justify-content: flex-end">
<button aria-label="Change language, current: English" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D5DBD2; background: #FFFFFF; color: #1B2620; font-family: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"></path></svg>
English
</button>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 28px">
<div style="width: 72px; height: 72px; border-radius: 20px; background: #1E6B45; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><path d="M9 12h4M11 10v4"></path></svg>
</div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Smart Livestock</h1>
<p style="margin: 0; font-size: 15px; color: #5B675F; text-align: center">Animal records, vets and official alerts in one place</p>
</div>

<form style="display: flex; flex-direction: column; gap: 16px; margin-top: 36px">

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="login-id" style="font-size: 14px; font-weight: 600">Phone number or email</label>
<input id="login-id" type="text" autocomplete="username" value="0788 123 456" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; color: #1B2620">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="password" style="font-size: 14px; font-weight: 600">Password</label>
<div style="position: relative">
<input id="password" type="password" autocomplete="current-password" value="••••••••" style="width: 100%; height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 0 56px 0 16px; font-family: inherit; font-size: 16px; color: #1B2620">
<button type="button" aria-label="Show password" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: none; background: transparent; color: #5B675F; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
</div>

<div style="display: flex; justify-content: flex-end; margin-top: -4px">
<a href="ForgotPassword.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 600">Forgot password?</a>
</div>

<a href="../farmer/Home.html" style="height: 52px; border-radius: 26px; background: #1E6B45; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Sign in</a>

</form>

<div style="flex: 1"></div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<p style="margin: 0; font-size: 15px; color: #3E4A43">New here? <a href="#" style="font-weight: 600">Create an account</a></p>
<p style="margin: 0; font-size: 13px; color: #5B675F; text-align: center; line-height: 1.45">Veterinarians can use the app after their account is verified.</p>
</div>

</div>
</body>
</html>
