<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot password</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B45}a:hover{color:#154D31}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F1; font-family: Inter, system-ui, sans-serif; color: #1B2620; display: flex; flex-direction: column; padding: 16px 24px 28px">

<a href="Login.html" aria-label="Back to sign in" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #1B2620">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px">
<div style="width: 56px; height: 56px; border-radius: 28px; background: #E3F0E8; color: #1E6B45; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
</div>
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Forgot your password?</h1>
<p style="margin: 0; font-size: 15px; color: #3E4A43; line-height: 1.5">Enter the phone number or email on your account. We'll send you a 6-digit code to set a new password.</p>
</div>

<form style="display: flex; flex-direction: column; gap: 16px; margin-top: 28px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="reset-id" style="font-size: 14px; font-weight: 600">Phone number or email</label>
<input id="reset-id" type="text" autocomplete="username" value="0788 123 456" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; color: #1B2620">
</div>
<a href="ResetPassword.html" style="height: 52px; border-radius: 26px; background: #1E6B45; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Send code</a>
</form>

<div style="flex: 1"></div>

<div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E6DF; font-size: 13px; color: #3E4A43; line-height: 1.45">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
<span>No phone or email on your account? Ask your system administrator to help you reset it.</span>
</div>

<p style="margin: 16px 0 0; font-size: 15px; text-align: center; color: #3E4A43">Remembered it? <a href="Login.html" style="font-weight: 600">Sign in</a></p>

</div>
</body>
</html>
