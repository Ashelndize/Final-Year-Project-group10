<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New disease report</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B45}a:hover{color:#154D31}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F1; font-family: Inter, system-ui, sans-serif; color: #1B2620; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 16px 12px 8px; display: flex; align-items: center; gap: 4px">
<a href="VetReports.html" aria-label="Back to my reports" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #1B2620">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; flex: 1; font-size: 18px; font-weight: 600">New disease report</h1>
</header>

<form style="flex: 1; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

<div style="display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #E8EEF7; color: #173F7A; font-size: 13px; line-height: 1.45">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
<span>Sent to the veterinary authority for review. It is not an official outbreak announcement.</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="species" style="font-size: 14px; font-weight: 600">Species</label>
<select id="species" style="height: 44px; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 0 10px; font-family: inherit; font-size: 15px; color: #1B2620"><option>Cattle</option><option>Goats</option><option>Sheep</option><option>Pigs</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="obs-date" style="font-size: 14px; font-weight: 600">Observed on</label>
<input id="obs-date" type="text" value="16 Nov 2026" style="height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 15px; color: #1B2620">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="district" style="font-size: 14px; font-weight: 600">District</label>
<select id="district" style="height: 44px; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 0 10px; font-family: inherit; font-size: 15px; color: #1B2620"><option>Nyagatare</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sector" style="font-size: 14px; font-weight: 600">Sector</label>
<select id="sector" style="height: 44px; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 0 10px; font-family: inherit; font-size: 15px; color: #1B2620"><option>Karangazi</option></select>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="affected" style="font-size: 14px; font-weight: 600">Animals showing signs</label>
<input id="affected" type="number" value="3" style="height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #1B2620">
</div>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">Signs observed</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #1E6B45; background: #E3F0E8; color: #1E6B45; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Fever</button>
<button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #1E6B45; background: #E3F0E8; color: #1E6B45; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Lameness</button>
<button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #1E6B45; background: #E3F0E8; color: #1E6B45; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Drooling</button>
<button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #D5DBD2; background: #FFFFFF; color: #1B2620; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Mouth lesions</button>
<button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #D5DBD2; background: #FFFFFF; color: #1B2620; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Reduced milk</button>
<button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #D5DBD2; background: #FFFFFF; color: #1B2620; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Abortion</button>
<button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #D5DBD2; background: #FFFFFF; color: #1B2620; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Sudden death</button>
<button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #D5DBD2; background: #FFFFFF; color: #1B2620; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Other</button>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="notes" style="font-size: 14px; font-weight: 600">Notes</label>
<textarea id="notes" rows="2" placeholder="Anything the reviewer should know" style="box-sizing: border-box; border-radius: 12px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 10px 14px; font-family: inherit; font-size: 15px; color: #1B2620; resize: none"></textarea>
</div>

<button type="button" style="height: 44px; border-radius: 12px; border: 1px dashed #9AA79F; background: transparent; color: #1B2620; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg>
Add photo (optional)
</button>

</form>

<div style="padding: 12px 20px 20px; background: #FFFFFF; border-top: 1px solid #E2E6DF; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; flex-shrink: 0">
<button style="height: 48px; border-radius: 24px; border: 1px solid #D5DBD2; background: #FFFFFF; color: #1B2620; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Save draft</button>
<a href="VetReports.html" style="height: 48px; border-radius: 24px; background: #1E6B45; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Submit report</a>
</div>

</div>
</body>
</html>
