<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — Livestock Authority Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #0f2419 0%, #14532d 60%, #15803d 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 440px;
      background: #fff; border-radius: 20px;
      padding: 40px 40px 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      border: none;
    }
    .icon-wrap {
      width: 64px; height: 64px;
      background: #dcfce7; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem; color: #16a34a;
      margin: 0 auto 20px;
    }
    h2 { font-size: 1.4rem; font-weight: 800; color: #0f172a; text-align: center; margin-bottom: 6px; }
    .subtitle { color: #64748b; font-size: .86rem; text-align: center; margin-bottom: 28px; line-height: 1.5; }
    .form-label { font-weight: 600; font-size: .82rem; color: #374151; margin-bottom: 5px; }
    .form-control {
      border: 1px solid #cbd5e1; border-radius: 10px;
      font-size: .9rem; padding: 11px 14px;
    }
    .form-control:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22,163,74,.12);
    }
    .btn-submit {
      background: #16a34a; border: none; color: #fff;
      border-radius: 10px; padding: 12px; font-size: .95rem;
      font-weight: 600; width: 100%; cursor: pointer;
      transition: background .2s;
    }
    .btn-submit:hover { background: #15803d; }
    .back-link {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      color: #64748b; font-size: .84rem; text-decoration: none; margin-top: 20px;
      font-weight: 500;
    }
    .back-link:hover { color: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap"><i class="bi bi-lock-fill"></i></div>
    <h2>Forgot Password?</h2>
    <p class="subtitle">Enter your registered email address and we will send you a 6-digit reset code.</p>

    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-danger d-flex gap-2 align-items-center py-2 mb-3" style="border-radius:10px;font-size:.84rem;">
          <i class="bi bi-exclamation-circle-fill"></i>{{ msg }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="your@email.com" required autofocus>
      </div>
      <button type="submit" class="btn-submit"><i class="bi bi-send me-2"></i>Send Reset Code</button>
    </form>

    <a href="{% url 'dashboard:login' %}" class="back-link">
      <i class="bi bi-arrow-left"></i> Back to Sign In
    </a>
  </div>
</body>
</html>
